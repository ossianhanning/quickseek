name: Feature request
description: An idea for Quickseek
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task or question Quickseek doesn't help with yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
