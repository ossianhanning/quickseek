[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gui", "crates/mcp", "crates/setup"]
# The installer embeds the other binaries: build it with tools\build-release.ps1.
default-members = ["crates/core", "crates/cli", "crates/gui", "crates/mcp"]

[workspace.package]
version = "19.9.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Ossian Hanning"]
repository = "https://github.com/ossianhanning/quickseek"
homepage = "https://github.com/ossianhanning/quickseek"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
