[package]
name = "quickseek-core"
description = "Quickseek engine: NTFS/ReFS indexes from the MFT, live USN updates, search, folder sizes and history"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
log = "0.4.34"
memchr = "2.8.3"
parking_lot = "0.12.5"
quickseek-remote = { path = "../remote" }
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
windows = { version = "0.62.2", features = ["Win32_Storage_IndexServer", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Ioctl", "Win32_System_IO", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemServices", "Win32_System_Time", "Win32_System_Pipes", "Win32_Security_Authorization", "Win32_System_SystemInformation", "Win32_NetworkManagement_WNet"] }
zstd = "0.14.3"

[dev-dependencies]
quickseek-agent = { path = "../agent" }
