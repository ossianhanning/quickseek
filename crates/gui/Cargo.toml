[package]
name = "quickseek-gui"
description = "quickseek's window: search as you type, folder size tree, what grew"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.34"
memchr = "2.8.3"
parking_lot = "0.12.5"
quickseek-core = { path = "../core" }
quickseek-mcp = { path = "../mcp" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemServices", "Win32_Graphics_Gdi", "Win32_System_SystemServices", "Win32_UI_Shell_Common", "Win32_UI_Accessibility", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_UI_Controls_RichEdit"] }
windows-core = "0.62"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Ole", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_Globalization", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_UI_Accessibility"] }

[dev-dependencies]
uiautomation = { version = "0.25.1", features = ["clipboard"] }
# The theme test captures windows (PrintWindow).
windows-sys = { version = "0.61.2", features = ["Win32_Storage_Xps"] }
