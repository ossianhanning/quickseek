[package]
name = "rapidfind"
description = "Command line for rapidfind: instant file search and folder sizes on Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
env_logger = "0.11.11"
log = "0.4.34"
rapidfind-core = { version = "0.1.0", path = "../core" }
rapidfind-mcp = { version = "0.1.0", path = "../mcp" }
serde_json = "1.0.154"
windows-service = "0.8.1"
